# Task Flow Web 서버 Nginx 설정 (T14, 로그인 횟수 제한 T22)
# 설치: sudo cp deploy/nginx-task-flow.conf /etc/nginx/sites-available/task-flow
#       sudo ln -s /etc/nginx/sites-available/task-flow /etc/nginx/sites-enabled/task-flow
# 화면 파일은 /var/www/task-flow에 복사해 둔다. (Nginx가 홈 폴더를 읽지 않도록 분리)

# 로그인 시도 횟수 제한(T22). 같은 IP에서 분당 5회, 한 번에 5회까지 몰아서 허용하고 넘으면 429.
# 이 파일은 nginx.conf의 http 블록 안에서 include되므로 limit_req_zone을 여기 둘 수 있다.
# 주의: ngrok 등 같은 서버의 프록시를 거치면 모든 요청의 IP가 127.0.0.1이 되어 제한을 함께 쓴다.
limit_req_zone $binary_remote_addr zone=tf_login:10m rate=5r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/task-flow;
    index index.html;

    # 화면 파일. 배포 후 예전 app.js가 쓰이지 않도록 매번 변경 여부를 확인하게 한다.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # 로그인 요청은 횟수를 제한한 뒤 App 서버로 전달한다. 초과하면 API와 같은 형식의 429를 돌려준다.
    location = /api/auth/login {
        limit_req zone=tf_login burst=5 nodelay;
        limit_req_status 429;
        error_page 429 = @too_many_logins;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location @too_many_logins {
        default_type "application/json; charset=utf-8";
        add_header Retry-After 60 always;
        return 429 '{"detail":"로그인 시도가 너무 많습니다. 1분 뒤에 다시 시도하세요."}';
    }

    # API 요청만 App 서버로 전달한다. /docs 등 다른 FastAPI 경로는 공개하지 않는다.
    # App 서버를 분리하면 127.0.0.1을 App 서버의 사설 IP로 바꾼다.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
