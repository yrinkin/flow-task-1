# Task Flow Web 서버 Nginx 설정 (T14)
# 설치: sudo cp deploy/nginx-task-flow.conf /etc/nginx/sites-available/task-flow
#       sudo ln -s /etc/nginx/sites-available/task-flow /etc/nginx/sites-enabled/task-flow
# 화면 파일은 /var/www/task-flow에 복사해 둔다. (Nginx가 홈 폴더를 읽지 않도록 분리)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;
    client_max_body_size 16k;
    add_header X-Content-Type-Options nosniff always;

    root /var/www/task-flow;
    index index.html;

    # 화면 파일. 배포 후 예전 app.js가 쓰이지 않도록 매번 변경 여부를 확인하게 한다.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri $uri/ =404;
    }

    # API 요청만 App 서버로 전달한다. /docs 등 다른 FastAPI 경로는 공개하지 않는다.
    # App 서버를 분리하면 127.0.0.1을 App 서버의 사설 IP로 바꾼다.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
